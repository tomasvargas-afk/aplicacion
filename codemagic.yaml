workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    environment:
      groups:
        - supabase_creds
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create .env file
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign -t lib/main_prod.dart --flavor ios-production
      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/*.app Payload/
          zip -r unsigned.ipa Payload
    artifacts:
      - unsigned.ipa
